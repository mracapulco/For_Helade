; Vozes geradas pelo ElevenLabs (scripts/ferramentas/gerar_vozes.gd).
; Uma seção por voz:
;   voz_id     ID da voz no ElevenLabs (Voices > copiar ID). Uma lista de
;              IDs faz um coro: todos dizem a mesma fala juntos.
;   modelo     modelo de texto para fala. O eleven_v3 é o mais expressivo e
;              entende as emoções de data/vozes/direcao.cfg.
;   estabilidade  no v3: 0.0 (mais criativo e emotivo), 0.5 (natural) ou
;              1.0 (estável, mais monótono).
;   sotaque    etiqueta posta na frente de toda fala desta voz, para puxar
;              o sotaque. Sem ela o v3 às vezes fala como em Portugal.
;   falantes   nomes de personagem do roteiro cujas falas usam esta voz,
;              escritos como no roteiro (o que vem antes dos dois-pontos).
;              "*" = qualquer personagem com nome que não tenha voz própria
;              (bom para NPCs e figurantes).
;   narracao   IDs de falas SEM nome no roteiro que também usam esta voz
;              (narração em primeira pessoa). Títulos de lugar, falas de
;              outros personagens e os sussurros finais ficam de fora.
;              Só vale para falas sem nome: fala com "Nicholas:" na frente
;              segue "falantes" e "roteiros".
;   roteiros   (opcional) a voz só vale nos roteiros cujo caminho tem um
;              destes nomes, e nesses roteiros ela vence a voz geral do
;              mesmo personagem. É assim que o mesmo personagem tem voz de
;              criança num capítulo e de adulto em outro.
;              Ex.: roteiros=["capitulo_01", "capitulo_02"]
;   falas      (opcional) IDs que usam esta voz custe o que custar, com
;              nome ou sem. Para exceções, fala por fala.

[nicholas]
; Nicholas adulto: narrador do prólogo e voz geral dele fora dos
; capítulos que têm voz de idade própria.
voz_id="ELBrtmIkk40wCZ5YnlwM"
modelo="eleven_v3"
estabilidade=0.5
sotaque="[Brazilian Portuguese accent]"
falantes=["Nicholas"]
narracao=["PROLOGO_003", "PROLOGO_004", "PROLOGO_005", "PROLOGO_007", "PROLOGO_008", "PROLOGO_009", "PROLOGO_010", "PROLOGO_011", "PROLOGO_012", "PROLOGO_013", "PROLOGO_015", "PROLOGO_016", "PROLOGO_017", "PROLOGO_019", "PROLOGO_020", "PROLOGO_021", "PROLOGO_022", "PROLOGO_024", "PROLOGO_025", "PROLOGO_026", "CAP1_051"]

