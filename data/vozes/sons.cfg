; Sons que acompanham uma fala, gerados pelo ElevenLabs junto com as vozes
; (scripts/ferramentas/gerar_vozes.gd). A fala continua na tela como está;
; o som toca junto com ela (arquivo assets/audio/vozes/<ID>_som.mp3).
; Uma seção por fala, com o ID dela entre colchetes. Dois tipos:
;
;   efeito     descrição do som em inglês (o gerador de efeitos do ElevenLabs
;              entende melhor), para barulhos e gente ao fundo.
;   duracao    (opcional, com efeito) segundos do som, de 0.5 a 22.
;
;   voz        nome de uma voz do vozes.cfg, para um som feito pela voz de um
;              personagem (um resmungo, um suspiro).
;   falado     o que essa voz diz, com as emoções entre colchetes.

[CAP1_093]
; "Bateu o pé no chão." Nicholas, 11 anos, impaciente na porta de Althea.
efeito="A boy stamps his foot once on a wooden floor in a quiet corridor, then lets out a short, annoyed huff"
duracao=2.5

[CAP1_034]
; "Finalmente, ouviu cochichos e risos abafados." As empregadas chegando.
efeito="Several women whispering and giggling softly, muffled laughter, slowly getting closer down a stone corridor, a small cart rolling"
duracao=5.0

[CAP1_094]
; "Ela resmungou e apertou a pelúcia." Althea, 6 anos, dormindo.
voz="althea_crianca"
falado="[sleepy] [grumbles] Mmm... hmm."
