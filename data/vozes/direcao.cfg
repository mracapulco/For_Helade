; Direção de interpretação de cada fala com voz (ID da fala = emoção).
; As etiquetas entre colchetes vão na frente do texto para o ElevenLabs v3
; e não são lidas em voz alta. Ficam em inglês porque é o que o modelo
; entende; dá para combinar várias: "[sad] [whispers]".
; Exemplos úteis: [sad] [happy] [angry] [annoyed] [whispers] [softly]
; [sighs] [laughs] [excited] [nervous] [crying] [coldly] [playfully]
; Mudou uma linha aqui? Rode o gerador de novo: só essa fala é refeita.

