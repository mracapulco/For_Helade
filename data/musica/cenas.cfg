; Música e ambiente de cada cena, por etapa. O autoload Trilha lê este arquivo:
; quando uma cena daqui abre, toca o "inicio"; quando ela emite etapa_mudou(etapa),
; toca o que estiver na etapa. Etapa que não aparece aqui não muda nada.
;
; Cada valor: [música, ambiente] ou [música, ambiente, segundos do fade].
;   ""  = silêncio (para com fade)
;   "=" = deixa como está
; Cena que não está aqui (o mapa, os acampamentos, o prólogo) cuida da própria
; música e o ambiente para quando ela abre.
; Músicas: tools/audio/gerar_musicas_capitulo_01.py
; Ambientes: tools/audio/gerar_ambientes_capitulo_01.py

[res://scenes/main/main.tscn]
; o menu toca a música dele mesmo
inicio = ["", ""]

; ---------------------------------------------------------------- Capítulo 01

[res://scenes/capitulo_01/capitulo_01.tscn]
; "A música vinha de algum lugar, alta demais, distante demais"
abertura = ["res://assets/audio/music/capitulo_01/cap01_sonho.wav", ""]
sonho = ["res://assets/audio/music/capitulo_01/cap01_sonho.wav", ""]
; a porta se abre para o frio: "O silêncio não era vazio, era pesado"
porta_do_sonho = ["", "", 0.4]
; "Apenas o silêncio da Mansão Olympia antes do amanhecer"
quarto = ["res://assets/audio/music/capitulo_01/cap01_madrugada.wav", "", 3.0]
cortejo = ["res://assets/audio/music/capitulo_01/cap01_cortejo.wav", "="]
quarto_althea = ["res://assets/audio/music/capitulo_01/cap01_aniversario.wav", "="]
duque = ["res://assets/audio/music/capitulo_01/cap01_duque.wav", "=", 1.0]
carruagem = ["res://assets/audio/music/capitulo_01/cap01_carruagem.wav", "="]
palacio = ["res://assets/audio/music/capitulo_01/cap01_palacio.wav", "res://assets/audio/ambiente/capitulo_01/fonte_palacio.ogg", 2.5]

[res://scenes/capitulo_01/cena_palacio.tscn]
inicio = ["res://assets/audio/music/capitulo_01/cap01_palacio.wav", "res://assets/audio/ambiente/capitulo_01/fonte_palacio.ogg"]
ophelia = ["res://assets/audio/music/capitulo_01/cap01_ophelia.wav", "=", 2.5]
ultimo_olhar = ["res://assets/audio/music/capitulo_01/cap01_palacio.wav", "=", 2.5]
visao_carruagem = ["res://assets/audio/music/capitulo_01/cap01_carruagem.wav", "", 2.0]

[res://scenes/capitulo_01/cena_visao.tscn]
; a visão (visao_varanda) tem os próprios sons: cascos, tic-tac, vento, queda
inicio = ["res://assets/audio/music/capitulo_01/cap01_carruagem.wav", ""]
visao = ["", "", 1.5]
apelido = ["res://assets/audio/music/capitulo_01/cap01_carruagem.wav", "", 2.0]
butiques = ["res://assets/audio/music/capitulo_01/cap01_butiques.wav", "res://assets/audio/ambiente/capitulo_01/rua_butiques.ogg", 2.0]

[res://scenes/capitulo_01/cena_butiques.tscn]
inicio = ["res://assets/audio/music/capitulo_01/cap01_butiques.wav", "res://assets/audio/ambiente/capitulo_01/rua_butiques.ogg"]
loja = ["res://assets/audio/music/capitulo_01/cap01_loja.wav", "", 1.0]
restaurante = ["res://assets/audio/music/capitulo_01/cap01_restaurante.wav", "res://assets/audio/ambiente/capitulo_01/restaurante.ogg", 2.0]

[res://scenes/capitulo_01/cena_restaurante.tscn]
inicio = ["res://assets/audio/music/capitulo_01/cap01_restaurante.wav", "res://assets/audio/ambiente/capitulo_01/restaurante.ogg"]
