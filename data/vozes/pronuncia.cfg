; Pronúncia de nomes que a voz erra. Do lado esquerdo, a palavra como está
; escrita no roteiro; do lado direito, como ela deve soar.
; Só muda o áudio: na tela o nome continua escrito do jeito certo.
; Vale palavra inteira e diferencia maiúscula de minúscula: "Thea" não mexe
; no "Thea" de dentro de "Althea" (esse tem a própria linha).
; Escreva o som do jeito que um brasileiro leria. O acento marca a sílaba
; forte: "Alfía" = al-FÍ-a.
; Mudou uma linha? Rode o gerador: só as falas com essa palavra são refeitas.

[pronuncia]
Althea="Alfía"
Thea="Fía"
Ophelia="Ofília"
